<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E3858"/>
      <stop offset="1" stop-color="#141A2C"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CB9FF"/>
      <stop offset="1" stop-color="#3868EE"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="18"/>
      <feOffset dy="14" result="blur"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.45"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- macOS のアイコングリッド（1024 中 824 角・角丸 185）に合わせた下地 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#background)"/>

  <rect x="652" y="318" width="156" height="120" rx="26" fill="#F5A524"/>
  <rect x="476" y="306" width="164" height="120" rx="26" fill="#34C38F"/>

  <path filter="url(#shadow)" fill="url(#folder)" d="
    M 200 408 A 48 48 0 0 1 248 360 L 264 360 L 264 320 A 28 28 0 0 1 292 292
    L 436 292 A 28 28 0 0 1 464 320 L 464 360 L 776 360 A 48 48 0 0 1 824 408
    L 824 752 A 48 48 0 0 1 776 800 L 248 800 A 48 48 0 0 1 200 752 Z"/>

  <line x1="512" y1="416" x2="512" y2="752" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="8" stroke-linecap="round"/>

  <rect x="236" y="486" width="248" height="56" rx="14" fill="#FFFFFF" fill-opacity="0.22"/>
  <g fill="#FFFFFF">
    <rect x="252" y="432" width="28" height="24" rx="6"/>
    <rect x="252" y="502" width="28" height="24" rx="6"/>
    <rect x="252" y="572" width="28" height="24" rx="6"/>
    <rect x="252" y="642" width="28" height="24" rx="6"/>
    <rect x="552" y="432" width="28" height="24" rx="6"/>
    <rect x="552" y="502" width="28" height="24" rx="6"/>
    <rect x="552" y="572" width="28" height="24" rx="6"/>
  </g>
  <g stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="14" stroke-linecap="round">
    <line x1="302" y1="444" x2="440" y2="444"/>
    <line x1="302" y1="514" x2="464" y2="514"/>
    <line x1="302" y1="584" x2="410" y2="584"/>
    <line x1="302" y1="654" x2="448" y2="654"/>
    <line x1="602" y1="444" x2="760" y2="444"/>
